<c-vars class="" value></c-vars>

<div
  x-data="{ own: $el.dataset.value }" data-value="{{ value }}" x-show="isOpen(own)"
  x-collapse.duration.300ms
  x-cloak
  class="overflow-hidden text-sm"
  data-slot="accordion-content" {{ attrs }}
>
  <div class="pb-4 pt-0 {% if class %}{{ class }}{% endif %}">
    {{ slot }}
  </div>
</div>
