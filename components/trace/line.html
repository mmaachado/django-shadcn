<c-vars class="" status=""></c-vars>

<span class="
    flex w-fit max-w-full min-w-0 items-center gap-2 text-sm
    text-muted-foreground transition-colors
    in-[a,button]:cursor-pointer in-[a:hover,button:hover]:text-foreground
    data-[status=error]:text-destructive
    data-[status=error]:in-[a:hover,button:hover]:text-destructive
    data-[status=pending]:opacity-60
    data-[status=running]:*:data-[slot=trace-title]:shimmer
    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="trace-line" {% if status %}data-status="{{ status }}"{% endif %} {{ attrs }}>
    {{ slot }}
</span>
