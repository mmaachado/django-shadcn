<c-vars class=""></c-vars>

{% comment %}
A line can sit inside a link or a button, to open a source or a step. The
rules on the children style that wrapper, so it needs no classes of its own.
{% endcomment %}
<div class="
    flex w-full min-w-0 flex-col gap-2
    *:has-[>[data-slot=trace-line]]:flex
    *:has-[>[data-slot=trace-line]]:w-fit
    *:has-[>[data-slot=trace-line]]:max-w-full
    *:has-[>[data-slot=trace-line]]:min-w-0
    *:has-[>[data-slot=trace-line]]:rounded-md
    *:has-[>[data-slot=trace-line]]:text-start
    *:has-[>[data-slot=trace-line]]:outline-none
    *:has-[>[data-slot=trace-line]]:focus-visible:ring-3
    *:has-[>[data-slot=trace-line]]:focus-visible:ring-ring/50
    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="trace" {{ attrs }}>
    {{ slot }}
</div>
