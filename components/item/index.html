<c-vars variant="default" size="default"></c-vars>

<div class="
    group/item flex flex-wrap items-center rounded-md border border-transparent
    text-sm transition-colors duration-100 outline-none
    focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50
    [a]:transition-colors [a]:hover:bg-accent/50

    {% if variant == 'default' %}bg-transparent
    {% elif variant == 'outline' %}border-border
    {% elif variant == 'muted' %}bg-muted/50
    {% endif %}

    {% if size == 'default' %}gap-4 p-4
    {% elif size == 'sm' %}gap-2.5 px-4 py-3
    {% endif %}

    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="item" data-variant="{{ variant }}" data-size="{{ size }}" {{ attrs }}>
    {{ slot }}
</div>
