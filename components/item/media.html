<c-vars class="" variant="default"></c-vars>

<div class="
    flex shrink-0 items-center justify-center gap-2 [&_svg]:pointer-events-none
    group-has-[[data-slot=item-description]]/item:translate-y-0.5
    group-has-[[data-slot=item-description]]/item:self-start

    {% if variant == 'default' %}bg-transparent
    {% elif variant == 'icon' %}size-8 rounded-sm border bg-muted [&_svg:not([class*='size-'])]:size-4
    {% elif variant == 'image' %}size-10 overflow-hidden rounded-sm [&_img]:size-full [&_img]:object-cover
    {% endif %}

    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="item-media" data-variant="{{ variant }}" {{ attrs }}>
    {{ slot }}
</div>
