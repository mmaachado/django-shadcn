<c-vars is_active="false" size="icon"></c-vars>

<a
    class="
    inline-flex items-center justify-center gap-2 rounded-md text-sm
    font-medium whitespace-nowrap transition-colors
    focus-visible:outline-hidden focus-visible:ring-1 focus-visible:ring-ring
    disabled:pointer-events-none disabled:opacity-50
    [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0

    {% if is_active == 'true' %}border border-input bg-background shadow-xs hover:bg-accent hover:text-accent-foreground
    {% else %}hover:bg-accent hover:text-accent-foreground
    {% endif %}

    {% if size == 'default' %}h-9 px-4 py-2
    {% elif size == 'sm' %}h-8 rounded-md px-3 text-xs
    {% elif size == 'lg' %}h-10 rounded-md px-8
    {% elif size == 'icon' %}size-9
    {% endif %}

    {% if class %}
    {{ class }}
    {% endif %}
    "
    data-slot="pagination-link"
    data-active="{{ is_active }}"
    {% if is_active == 'true' %}aria-current="page"{% endif %}
    {{ attrs }}
>
    {{ slot }}
</a>
