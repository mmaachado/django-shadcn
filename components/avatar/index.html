<c-vars class="" size="default"></c-vars>

<span class="
    group/avatar relative flex size-8 shrink-0 rounded-full select-none
    data-[size=lg]:size-10 data-[size=sm]:size-6
    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="avatar" data-size="{{ size }}" {{ attrs }}>
    {{ slot }}
</span>
