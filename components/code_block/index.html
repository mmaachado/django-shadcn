<c-vars class="" variant="default" size="default"></c-vars>

<div class="
    group/code-block relative flex w-full min-w-0 flex-col overflow-hidden
    rounded-lg text-sm data-[size=sm]:text-xs
    has-[>[data-slot=code-block-content]:focus-visible]:ring-3
    has-[>[data-slot=code-block-content]:focus-visible]:ring-ring/50

    {% if variant == 'default' %}border border-input text-foreground dark:bg-input/30 has-[>[data-slot=code-block-content]:focus-visible]:border-ring
    {% elif variant == 'destructive' %}border border-destructive/30 text-destructive dark:border-destructive/40
    {% endif %}

    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="code-block" data-variant="{{ variant }}" data-size="{{ size }}" {{ attrs }}>
    {{ slot }}
</div>
