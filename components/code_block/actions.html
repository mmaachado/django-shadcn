<c-vars class=""></c-vars>

{% comment %}
In the header the actions sit at its end. Placed straight inside the block,
they float over its top corner instead, and show on hover, on focus, or always
on a touch screen.
{% endcomment %}
<div class="
    -my-1 -me-1.5 ms-auto flex shrink-0 items-center gap-1
    [[data-slot=code-block]>&]:absolute [[data-slot=code-block]>&]:z-10
    [[data-slot=code-block]>&]:m-0 [[data-slot=code-block]>&]:top-3
    [[data-slot=code-block]>&]:end-3
    [[data-slot=code-block]>&]:opacity-0
    [[data-slot=code-block]>&]:transition-opacity
    [[data-slot=code-block]>&]:group-focus-within/code-block:opacity-100
    [[data-slot=code-block]>&]:group-hover/code-block:opacity-100
    [[data-slot=code-block]>&]:pointer-coarse:opacity-100
    group-data-[size=sm]/code-block:[[data-slot=code-block]>&]:top-2
    group-data-[size=sm]/code-block:[[data-slot=code-block]>&]:end-2
    [[data-slot=code-block]>&]:*:[button]:bg-background
    [[data-slot=code-block]>&]:*:[button]:ring-1
    [[data-slot=code-block]>&]:*:[button]:ring-foreground/10
    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="code-block-actions" {{ attrs }}>
    {{ slot }}
</div>
