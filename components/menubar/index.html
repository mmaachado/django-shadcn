<c-vars class=""></c-vars>

{% comment %}
Which menu is open is tracked by element identity, so a menu needs no name and
the trigger and content find each other through their shared parent.
{% endcomment %}
<div x-data="{ active: null }" @click.outside="active = null" @keydown.escape.window="active = null" role="menubar"
    class="
    flex h-9 items-center gap-1 rounded-md border bg-background p-1 shadow-xs
    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="menubar" {{ attrs }}>
    {{ slot }}
</div>
