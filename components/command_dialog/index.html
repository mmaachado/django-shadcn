<c-vars class="" shortcut_key="k"></c-vars>

{% comment %}
left-[50%] stays physical: with translate-x-[-50%] it centres the
dialog, and the centre is the same in either direction.
{% endcomment %}

<div
  x-data="{
    open: false,

    toggleDialog() {
      this.open = !this.open;
      if (this.open) {
        document.body.classList.add('overflow-hidden');
      } else {
        document.body.classList.remove('overflow-hidden');
      }
    }
  }"
  @keydown.window="if (event.key === $el.dataset.shortcutKey && (event.metaKey || event.ctrlKey)) {
    event.preventDefault();
    toggleDialog();
  }"
  data-shortcut-key="{{ shortcut_key }}"
  {{ attrs }}
>
  <div @click="toggleDialog" class="{% if class %}{{ class }}{% endif %}">
    {{ trigger_slot }}
  </div>

  <div
    x-show="open"
    x-transition:enter="ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-50 bg-background/80 backdrop-blur-xs"
    @click="toggleDialog"
    x-cloak
  ></div>

  <div
    x-show="open"
    x-transition:enter="ease-out duration-300"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
    class="fixed left-[50%] top-[50%] z-50 w-full max-w-lg translate-x-[-50%] translate-y-[-50%] border bg-background p-6 shadow-lg sm:rounded-lg md:w-full"
    x-cloak
    @click.away="toggleDialog"
    @close-command="toggleDialog"
    x-ref="dialogContent"
    role="dialog"
    aria-modal="true"
    x-init="let back = null; $watch('open', shown => { if (shown) { back = document.activeElement; $nextTick(() => ($el.querySelector('a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex^=\'-\'])') || $el).focus()); } else if (back) { back.focus(); back = null; } })"
    @keydown.window="if (open && $event.key === 'Tab') { const items = [...$el.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex^=\'-\'])')].filter(item => item.getClientRects().length); const edge = $event.shiftKey ? items[0] : items.at(-1); if (!items.length || document.activeElement === edge || !$el.contains(document.activeElement)) { $event.preventDefault(); (items.length ? ($event.shiftKey ? items.at(-1) : items[0]) : $el).focus(); } }"
    tabindex="-1"
  >
    <c-command>
      {{ slot }}
    </c-command>
  </div>
</div>
