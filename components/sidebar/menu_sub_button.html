<c-vars size="md" is_active="false"></c-vars>

<a class="
    flex h-7 min-w-0 -translate-x-px items-center gap-2 overflow-hidden
    rounded-md px-2 text-sidebar-foreground ring-sidebar-ring outline-hidden
    hover:bg-sidebar-accent hover:text-sidebar-accent-foreground
    focus-visible:ring-2
    active:bg-sidebar-accent active:text-sidebar-accent-foreground
    disabled:pointer-events-none disabled:opacity-50
    aria-disabled:pointer-events-none aria-disabled:opacity-50
    [&>span:last-child]:truncate [&>svg]:size-4 [&>svg]:shrink-0
    [&>svg]:text-sidebar-accent-foreground
    data-[active=true]:bg-sidebar-accent
    data-[active=true]:text-sidebar-accent-foreground
    group-data-[collapsible=icon]:hidden

    {% if size == 'sm' %}text-xs
    {% else %}text-sm
    {% endif %}

    {% if class %}
        {{ class }}
    {% endif %}
    " data-active="{{ is_active }}" data-size="{{ size }}" data-sidebar="menu-sub-button"
    data-slot="sidebar-menu-sub-button" {{ attrs }}>
    {{ slot }}
</a>
