<c-vars class=""></c-vars>

{% comment %}
The left- and right- utilities stay physical. The rail sits on the
edge of the sidebar, and side="left" and side="right" name a side of
the screen that does not change with the direction.
{% endcomment %}

<button @click="toggle()" type="button" tabindex="-1" aria-label="Toggle Sidebar" title="Toggle Sidebar" class="
    absolute inset-y-0 z-20 hidden w-4 -translate-x-1/2 transition-all
    ease-linear group-data-[side=left]:-right-4 group-data-[side=right]:left-0
    after:absolute after:inset-y-0 after:left-1/2 after:w-[2px]
    hover:after:bg-sidebar-border sm:flex
    in-data-[side=left]:cursor-w-resize in-data-[side=right]:cursor-e-resize
    [[data-side=left][data-state=collapsed]_&]:cursor-e-resize
    [[data-side=right][data-state=collapsed]_&]:cursor-w-resize
    group-data-[collapsible=offcanvas]:translate-x-0
    group-data-[collapsible=offcanvas]:after:left-full
    hover:group-data-[collapsible=offcanvas]:bg-sidebar
    [[data-side=left][data-collapsible=offcanvas]_&]:-right-2
    [[data-side=right][data-collapsible=offcanvas]_&]:-left-2
    {% if class %}
        {{ class }}
    {% endif %}
    " data-sidebar="rail" data-slot="sidebar-rail" {{ attrs }}></button>
