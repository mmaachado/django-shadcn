<c-vars class="" default_open="false"></c-vars>

<div
    x-data="{ open: {% if default_open == 'true' %}true{% else %}false{% endif %} }"
    x-bind:data-state="open ? 'open' : 'closed'"
    class="{% if class %}{{ class }}{% endif %}"
    data-slot="collapsible"
    {{ attrs }}
>
    {{ slot }}
</div>
