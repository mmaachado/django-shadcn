<c-vars class=""></c-vars>

<div x-data="{
        open: false,
        x: 0,
        y: 0,
        openAt(event) {
            this.x = event.clientX;
            this.y = event.clientY;
            this.open = true;
        }
    }" @keydown.escape.window="open = false" x-bind:data-state="open ? 'open' : 'closed'"
    class="{% if class %}{{ class }}{% endif %}" data-slot="context-menu" {{ attrs }}>
    {{ slot }}
</div>
