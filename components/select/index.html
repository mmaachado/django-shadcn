<c-vars class="" name=""></c-vars>

<div
  x-data="{
    open: false,
    value: '',
    displayText: '',
    // The option the keyboard is on while the list is open. Focus stays on
    // the trigger, which points at it through aria-activedescendant.
    active: null,
    typed: '',
    typedAt: 0,

    toggle() {
      this.open ? this.close() : this.show();
    },

    show() {
      this.open = true;
      const options = this.options();
      this.active = options.some(option => option.dataset.value === this.value)
        ? this.value
        : options[0]?.dataset.value ?? null;
      this.reveal();
    },

    close() {
      this.open = false;
      this.active = null;
    },

    select(val, label) {
      this.value = val;
      this.displayText = label;
      this.close();
      this.root().querySelector('[data-slot=select-trigger]')?.focus();
    },

    // Looked up on each call: an element kept in Alpine's data is wrapped
    // in a proxy that querySelectorAll does not search through.
    root() {
      return this.$el.closest('[data-slot=select]');
    },

    options() {
      return [...this.root().querySelectorAll('[role=option]:not([data-disabled])')];
    },

    reveal() {
      this.$nextTick(() => this.options()
        .find(option => option.dataset.value === this.active)
        ?.scrollIntoView({ block: 'nearest' }));
    },

    // Arrows, Home and End move through the options without wrapping, Enter
    // and Space pick one, Tab closes, and typing jumps to an option that
    // starts with what was typed.
    key(event) {
      const options = this.options();
      if (!this.open) {
        if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(event.key)) {
          event.preventDefault();
          this.show();
          if (event.key === 'ArrowUp' && !this.value) {
            this.active = options.at(-1)?.dataset.value ?? null;
          }
        }
        return;
      }
      const at = options.findIndex(option => option.dataset.value === this.active);
      let next = null;
      if (event.key === 'ArrowDown') next = Math.min(at + 1, options.length - 1);
      else if (event.key === 'ArrowUp') next = Math.max(at - 1, 0);
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = options.length - 1;
      else if ((event.key === 'Enter' || event.key === ' ') && !(event.key === ' ' && this.typed && Date.now() - this.typedAt < 500)) {
        event.preventDefault();
        if (at >= 0) this.select(options[at].dataset.value, options[at].textContent.trim());
        return;
      } else if (event.key === 'Tab') {
        this.close();
        return;
      } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
        this.typed = Date.now() - this.typedAt < 500 ? this.typed + event.key.toLowerCase() : event.key.toLowerCase();
        this.typedAt = Date.now();
        const order = [...options.slice(at + 1), ...options.slice(0, at + 1)];
        const match = (this.typed.length > 1 ? options : order)
          .find(option => option.textContent.trim().toLowerCase().startsWith(this.typed));
        if (match) next = options.indexOf(match);
      }
      if (next === null || next < 0) return;
      event.preventDefault();
      this.active = options[next].dataset.value;
      this.reveal();
    },

    init() {
      // Close when clicking outside
      document.addEventListener('click', event => {
        if (this.open && !this.$el.contains(event.target)) {
          this.close();
        }
      });
    }
  }"
  x-id="['select-listbox', 'select-option']"
  class="relative {% if class %}{{ class }}{% endif %}"
  @keydown.escape="close()"
  data-slot="select" {{ attrs }}
>
  <!-- Hidden form input for the value -->
  {% if name %}
  <input type="hidden" name="{{ name }}" x-bind:value="value">
  {% endif %}

  {{ slot }}
</div>
