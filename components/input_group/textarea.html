<textarea
    class="
    flex w-full min-w-0 flex-1 resize-none rounded-none border-0 bg-transparent
    px-3 py-3 text-sm shadow-none
    placeholder:text-muted-foreground
    focus-visible:outline-hidden focus-visible:ring-0
    disabled:cursor-not-allowed disabled:opacity-50
    dark:bg-transparent
    {% if class %}
        {{ class }}
    {% endif %}
    "
    data-slot="input-group-control"
    {{ attrs }}
>{{ slot }}</textarea>
