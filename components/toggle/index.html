<c-vars variant="default" size="default" pressed="false"></c-vars>

<button
    type="button"
    x-data="{ on: {% if pressed == 'true' %}true{% else %}false{% endif %} }"
    @click="on = !on"
    x-bind:data-state="on ? 'on' : 'off'"
    x-bind:aria-pressed="on"
    class="
    inline-flex items-center justify-center gap-2 rounded-md text-sm
    font-medium whitespace-nowrap transition-[color,box-shadow] outline-none
    hover:bg-muted hover:text-muted-foreground
    focus-visible:border-ring focus-visible:ring-[3px]
    focus-visible:ring-ring/50
    disabled:pointer-events-none disabled:opacity-50
    aria-invalid:border-destructive aria-invalid:ring-destructive/20
    data-[state=on]:bg-accent data-[state=on]:text-accent-foreground
    dark:aria-invalid:ring-destructive/40
    [&_svg]:pointer-events-none [&_svg]:shrink-0
    [&_svg:not([class*='size-'])]:size-4

    {% if variant == 'default' %}bg-transparent
    {% elif variant == 'outline' %}border border-input bg-transparent shadow-xs hover:bg-accent hover:text-accent-foreground
    {% endif %}

    {% if size == 'default' %}h-9 min-w-9 px-2
    {% elif size == 'sm' %}h-8 min-w-8 px-1.5
    {% elif size == 'lg' %}h-10 min-w-10 px-2.5
    {% endif %}

    {% if class %}
    {{ class }}
    {% endif %}
    "
    data-slot="toggle"
    data-variant="{{ variant }}"
    data-size="{{ size }}"
    {{ attrs }}
>
    {{ slot }}
</button>
