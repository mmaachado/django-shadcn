<c-vars class="" state="done" size="default" orientation="horizontal"></c-vars>

<div class="
    group/attachment relative flex w-fit max-w-full min-w-0 shrink-0 flex-wrap
    rounded-xl border bg-card text-card-foreground transition-colors
    focus-within:ring-1 focus-within:ring-ring/50
    has-[>a,>button]:hover:bg-muted/50
    data-[state=error]:border-destructive/30 data-[state=idle]:border-dashed

    {% if size == 'default' %}gap-2 text-sm has-data-[slot=attachment-content]:px-2.5 has-data-[slot=attachment-content]:py-2 has-data-[slot=attachment-media]:p-2
    {% elif size == 'sm' %}gap-2.5 text-xs has-data-[slot=attachment-content]:px-2 has-data-[slot=attachment-content]:py-1.5 has-data-[slot=attachment-media]:p-1.5
    {% elif size == 'xs' %}gap-1.5 rounded-lg text-xs has-data-[slot=attachment-content]:px-1.5 has-data-[slot=attachment-content]:py-1 has-data-[slot=attachment-media]:p-1
    {% endif %}

    {% if orientation == 'horizontal' %}min-w-40 items-center
    {% elif orientation == 'vertical' %}w-24 flex-col has-data-[slot=attachment-content]:w-30
    {% endif %}

    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="attachment" data-state="{{ state }}" data-size="{{ size }}" data-orientation="{{ orientation }}" {{ attrs }}>
    {{ slot }}
</div>
