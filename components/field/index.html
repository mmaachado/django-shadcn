<c-vars class="" orientation="vertical"></c-vars>

<div class="
    group/field flex w-full gap-3 data-[invalid=true]:text-destructive

    {% if orientation == 'vertical' %}flex-col [&>*]:w-full [&>.sr-only]:w-auto
    {% elif orientation == 'horizontal' %}flex-row items-center [&>[data-slot=field-label]]:flex-auto has-[>[data-slot=field-content]]:items-start has-[>[data-slot=field-content]]:[&>[role=checkbox],[role=radio]]:mt-px
    {% elif orientation == 'responsive' %}flex-col @md/field-group:flex-row @md/field-group:items-center [&>*]:w-full @md/field-group:[&>*]:w-auto [&>.sr-only]:w-auto @md/field-group:[&>[data-slot=field-label]]:flex-auto @md/field-group:has-[>[data-slot=field-content]]:items-start @md/field-group:has-[>[data-slot=field-content]]:[&>[role=checkbox],[role=radio]]:mt-px
    {% endif %}

    {% if class %}
        {{ class }}
    {% endif %}
    " role="group" data-slot="field" data-orientation="{{ orientation }}" {{ attrs }}>
    {{ slot }}
</div>
