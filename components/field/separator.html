<c-vars class=""></c-vars>

<div class="
    relative -my-2 h-5 text-sm group-data-[variant=outline]/field-group:-mb-2
    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="field-separator" data-content="{% if slot %}true{% else %}false{% endif %}" {{ attrs }}>
    <c-separator class="absolute inset-0 top-1/2" />
    {% if slot %}
    <span class="relative mx-auto block w-fit bg-background px-2 text-muted-foreground"
        data-slot="field-separator-content">
        {{ slot }}
    </span>
    {% endif %}
</div>
