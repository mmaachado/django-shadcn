<c-vars errors></c-vars>

{% if slot or errors %}
<div class="
    text-sm font-normal text-destructive
    {% if class %}
        {{ class }}
    {% endif %}
    " role="alert" data-slot="field-error" {{ attrs }}>
    {% if slot %}
    {{ slot }}
    {% elif errors|length == 1 %}
    {{ errors.0 }}
    {% else %}
    <ul class="ml-4 flex list-disc flex-col gap-1">
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
{% endif %}
