<c-vars class=""></c-vars>

{% comment %}
The browser decides whether an answer counts and what to call the problem;
this only puts the sentence somewhere it stays on screen, next to the
question, after the native bubble has come and gone.
{% endcomment %}
<div class="
    mt-2 text-sm text-destructive
    {% if class %}
        {{ class }}
    {% endif %}
    " role="alert" x-show="message" x-cloak
    data-slot="questionnaire-error" {{ attrs }}>
    {% if slot %}
        {{ slot }}
    {% else %}
        <span x-text="message"></span>
    {% endif %}
</div>
