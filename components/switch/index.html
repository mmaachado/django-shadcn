<c-vars class="" size="default"></c-vars>

<label class="
    group/switch inline-flex shrink-0 items-center rounded-full border
    border-transparent bg-input shadow-xs transition-all cursor-pointer
    has-[:checked]:bg-primary
    has-[:focus-visible]:border-ring has-[:focus-visible]:ring-[3px]
    has-[:focus-visible]:ring-ring/50
    has-[:disabled]:cursor-not-allowed has-[:disabled]:opacity-50
    data-[size=default]:h-[1.15rem] data-[size=default]:w-8
    data-[size=sm]:h-3.5 data-[size=sm]:w-6
    dark:bg-input/80
    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="switch" data-size="{{ size }}">
    <input type="checkbox" class="sr-only" {{ attrs }}>
    <span class="
        pointer-events-none block rounded-full bg-background ring-0
        transition-transform
        group-data-[size=default]/switch:size-4
        group-data-[size=sm]/switch:size-3
        group-has-[:checked]/switch:translate-x-[calc(100%-2px)]
        dark:bg-foreground dark:group-has-[:checked]/switch:bg-primary-foreground
        " data-slot="switch-thumb"></span>
</label>
