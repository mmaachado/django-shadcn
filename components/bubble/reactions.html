<c-vars class="" side="bottom" align="end"></c-vars>

<div class="
    absolute z-10 flex w-fit shrink-0 items-center justify-center gap-1
    rounded-full bg-muted px-1.5 py-0.5 text-sm ring-3 ring-card
    has-[button]:p-0

    {% if side == 'top' %}top-0 -translate-y-3/4
    {% elif side == 'bottom' %}bottom-0 translate-y-3/4
    {% endif %}

    {% if align == 'start' %}left-3
    {% elif align == 'end' %}right-3
    {% endif %}

    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="bubble-reactions" data-side="{{ side }}" data-align="{{ align }}" {{ attrs }}>
    {{ slot }}
</div>
