<c-vars class="" error></c-vars>

<label
    class="
    text-sm font-medium leading-none
    peer-disabled:cursor-not-allowed peer-disabled:opacity-70
    {% if error %}text-destructive{% endif %}
    {% if class %}
        {{ class }}
    {% endif %}
    "
    data-slot="form-label" {{ attrs }}
>
    {{ slot }}
</label>
