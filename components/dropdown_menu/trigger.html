<c-vars class=""></c-vars>

<div @click="viaKeyboard = $event.detail === 0; open = !open"
    @keydown.down.prevent="viaKeyboard = true; open = true" aria-haspopup="menu" x-bind:aria-expanded="open"
    x-bind:data-state="open ? 'open' : 'closed'" class="outline-hidden {% if class %}{{ class }}{% endif %}"
    data-slot="dropdown-menu-trigger" {{ attrs }}>
    {{ slot }}
</div>
