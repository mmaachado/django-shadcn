<c-vars class="" inset=""></c-vars>

<div role="menuitem" tabindex="-1" @pointermove="$el.focus()"
    @keydown="if ($event.key === (getComputedStyle($el).direction === 'rtl' ? 'ArrowLeft' : 'ArrowRight') || $event.key === 'Enter' || $event.key === ' ') { $event.preventDefault(); $event.stopPropagation(); subOpen = true; $nextTick(() => $el.parentElement.querySelector(':scope > [data-slot$=sub-content] [role^=menuitem]:not([data-disabled])')?.focus()); }" aria-haspopup="menu" x-bind:aria-expanded="subOpen" class="
    flex cursor-default items-center gap-2 rounded-sm px-2 py-1.5 text-sm
    outline-hidden select-none
    focus:bg-accent focus:text-accent-foreground
    data-[inset=true]:ps-8
    data-[state=open]:bg-accent data-[state=open]:text-accent-foreground
    [&_svg]:pointer-events-none [&_svg]:shrink-0
    [&_svg:not([class*='size-'])]:size-4
    [&_svg:not([class*='text-'])]:text-muted-foreground
    {% if class %}
        {{ class }}
    {% endif %}
    " x-bind:data-state="subOpen ? 'open' : 'closed'" data-slot="dropdown-menu-sub-trigger" data-inset="{{ inset }}" {{ attrs }}>
    {{ slot }}
    <c-icon name="chevron-right" class="ms-auto size-4 rtl:rotate-180" />
</div>
