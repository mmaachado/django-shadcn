<c-vars variant="default" inset="" close_on_select="true"></c-vars>

<div role="menuitem" {% if close_on_select == 'true' %}@click="open = false"{% endif %} class="
    relative flex cursor-default items-center gap-2 rounded-sm px-2 py-1.5
    text-sm outline-hidden select-none
    focus:bg-accent focus:text-accent-foreground
    hover:bg-accent hover:text-accent-foreground
    data-[disabled]:pointer-events-none data-[disabled]:opacity-50
    data-[inset=true]:pl-8
    data-[variant=destructive]:text-destructive
    data-[variant=destructive]:hover:bg-destructive/10
    data-[variant=destructive]:hover:text-destructive
    dark:data-[variant=destructive]:hover:bg-destructive/20
    [&_svg]:pointer-events-none [&_svg]:shrink-0
    [&_svg:not([class*='size-'])]:size-4
    [&_svg:not([class*='text-'])]:text-muted-foreground
    data-[variant=destructive]:*:[svg]:text-destructive!
    {% if class %}
        {{ class }}
    {% endif %}
    " data-slot="dropdown-menu-item" data-variant="{{ variant }}" data-inset="{{ inset }}" {{ attrs }}>
    {{ slot }}
</div>
