<div class="relative mt-4">
    <button
        type="button"
        x-data="{ copied: false }"
        @click="
            navigator.clipboard.writeText(
                $el.parentElement.querySelector('code').textContent
            );
            copied = true;
            setTimeout(() => copied = false, 2000)
        "
        :aria-label="copied ? 'Copied' : 'Copy code'"
        class="absolute end-3 top-3 z-10 inline-flex size-7 items-center justify-center rounded-md border border-border bg-background text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
    >
        <c-icon name="copy" class="size-3.5" x-show="!copied" />
        <c-icon name="check" class="size-3.5" x-show="copied" x-cloak />
    </button>
    {{ slot }}
</div>
