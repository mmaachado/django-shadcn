version: 2
updates:
  # Version updates open against development. Security updates still open
  # against master: target-branch does not apply to them. Dependabot reads this
  # file from master, so the setting takes effect after the next release merge.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # The portal is its own uv and npm project, deployed on its own. Its locks
  # already get security alerts; these open the version updates too.
  - package-ecosystem: "uv"
    directory: "/app/v1/docs"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      portal-python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/app/v1/docs"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      portal-npm:
        patterns: ["*"]
