name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    # A tag goes to PyPI; a manual run rehearses the whole pipeline on TestPyPI.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version from the tag history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check the built version against the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --with packaging python .github/scripts/check_version.py "$GITHUB_REF_NAME"

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Rehearsing twice on the same commit builds the same version.
          skip-existing: true

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1

      # Runs after the package is already on PyPI, so it must never fail the
      # job: a missing section leaves an empty file and the generated notes
      # stand on their own.
      - name: Take the release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 == "## " version || index($0, "## " version " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md || true
          wc -l < release-notes.md

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
          --generate-notes
          dist/*
