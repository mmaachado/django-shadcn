name: Lucide icons

# A redrawn shape is a visual call the maintainer makes, not something a bot
# commits on its own, so this opens an issue instead of pushing a change.
on:
  workflow_dispatch:
  schedule:
    # Every Monday, 09:00 UTC: https://crontab.guru/#0_9_*_*_1
    - cron: "0 9 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for upstream changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the pinned icons against the latest lucide-static
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(npm view lucide-static version)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected lucide-static version: $version" >&2
            exit 1
          fi

          pinned=$(sed -n "s/^LUCIDE_VERSION = os.environ.get('LUCIDE_VERSION', '\(.*\)')\$/\1/p" scripts/generate_icons.py)
          if [ -z "$pinned" ]; then
            echo "could not read the pinned version" >&2
            exit 1
          fi

          count=$(($(ls components/icon/*.html | wc -l) - 1))

          LUCIDE_VERSION="$version" python3 scripts/generate_icons.py

          changed=$(git diff --name-only -- components/icon)

          if [ -z "$changed" ]; then
            echo "None of the $count icons changed between $pinned and $version." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="Lucide redrew icons since the pinned $pinned"

          body_file="$RUNNER_TEMP/issue-body.md"
          cat > "$body_file" <<EOF
          As of lucide-static \`$version\`, these partials differ from \`$pinned\`, the version pinned in \`scripts/generate_icons.py\`:

          $(printf '%s\n' "$changed" | sed 's/^/- /')

          To review: run \`LUCIDE_VERSION=$version python scripts/generate_icons.py\`, look at the affected components in the portal, and if you keep the new drawing, bump \`LUCIDE_VERSION\` in \`scripts/generate_icons.py\` to \`$version\`.
          EOF

          # One issue per pin: a newer release rewrites the open one's body.
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number")

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body_file"
            echo "Updated #$number for lucide-static $version." >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh issue create --title "$title" --label components --body-file "$body_file")
            echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi
