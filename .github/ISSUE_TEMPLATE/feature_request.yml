name: "Feature request"
description: Improve the CLI or an existing component
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a component that does not exist yet, use the component request template instead.

  - type: textarea
    id: description
    attributes:
      label: What should change?
      placeholder: "`add` should accept several components in one call."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the situation you ran into, not only the solution you have in mind.
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Affected area
      placeholder: CLI, or the name of a component
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      description: By submitting this issue, you agree to follow our [contributing guide](https://github.com/mmaachado/django-shadcn/blob/master/.github/CONTRIBUTING.md).
      options:
        - label: I have searched the existing issues
          required: true
