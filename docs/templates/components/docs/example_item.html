<c-vars background="bg-muted/30"></c-vars>

<div class="space-y-4 mt-8">
    <h3 class="font-semibold tracking-tight text-base scroll-m-20">
        {{ title }}
    </h3>
    <c-docs.demo-section background="{{ background }}">
        {{ slot }}
    </c-docs.demo-section>
    {% if code %}
    <c-docs.code-example :language="language">{{ code }}</c-docs.code-example>
    {% endif %}
</div>
