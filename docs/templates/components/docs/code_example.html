<div class="relative mt-4">
    <button
        type="button"
        x-data="{ copied: false }"
        @click="
            navigator.clipboard.writeText(
                $el.parentElement.querySelector('code').textContent
            );
            copied = true;
            setTimeout(() => copied = false, 2000)
        "
        :aria-label="copied ? 'Copied' : 'Copy code'"
        class="absolute right-3 top-3 inline-flex size-7 items-center justify-center rounded-md border border-border bg-background text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
    >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5" x-show="!copied">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5" x-show="copied" style="display: none;">
            <path d="M20 6 9 17l-5-5" />
        </svg>
    </button>
    <pre class="overflow-x-auto rounded-lg border border-border bg-muted/50 p-4 pr-12!"><code class="language-{{ language }} text-sm">{{ slot }}</code></pre>
</div>
