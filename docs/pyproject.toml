[project]
name = "docs"
version = "0.1.0"
description = "shadcn/ui for Django"
readme = "README.md"
# The playground runs the newest stack the components have to survive, so a
# break shows up here and not in someone else's project.
requires-python = ">=3.14"
dependencies = [
    "django-environ>=0.11.2",
    "django>=6.0",
    "django-htmx",
    "whitenoise>=6.8.2",
    "gunicorn>=23.0.0",
    # 2.x is the only line that supports Django 5.2 and up, and 2.7.1 carries
    # the fix for quotes escaping a dynamic attribute.
    "django-cotton>=2.7.2",
    "markdown>=3.7",
    "polib>=1.2",
]
