[project]
authors = [
    { name = "Marcelo Machado", email = "uniqueduckinbox@duck.com" },
    { name = "Sarthak Jariwala", email = "sarthak@sarthakjariwala.com" },
]
name = "django-shadcn"
dynamic = ["version"]
description = "shadcn/ui for Django"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "django",
    "shadcn",
    "ui",
    "django-shadcn",
    "components",
    "shadcnui",
    "library",
    "cotton",
    "alpinejs",
    "tailwindcss",
]
classifiers = [
    "Framework :: Django",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = ["typer>=0.15.1"]

[project.urls]
Homepage = "https://github.com/mmaachado/django-shadcn"
Issues = "https://github.com/mmaachado/django-shadcn/issues"

[dependency-groups]
dev = [
    "django>=5.1",
    # The components are rendered against cotton in the suite, so a change in
    # how it parses a component tag shows up here.
    "django-cotton>=2.7.2",
    "ignr>=2.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "taskipy>=1.14",
]

[project.scripts]
django_shadcn = "django_shadcn.main:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Untagged builds would carry a +g<sha> local segment, which public indexes
# reject. Tagged builds are unaffected.
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.sdist]
# Allowlist: anything not named here stays out of the published archive.
include = ["src", "tests", "components", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_shadcn"]

# The CLI reads the templates from the installed package, so they have to be
# in the wheel. `_components` rather than `components`, which would collide
# with the registry module.
[tool.hatch.build.targets.wheel.force-include]
"components" = "django_shadcn/_components"

[tool.ruff]
line-length = 79
extend-exclude = ["docs"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
# The package is small enough that anything less means a path nobody has
# ever run. Reach it with a test or delete it.
fail_under = 100

[tool.taskipy.tasks]
# Both checks, in the order CI runs them, so a local pass means a CI pass.
lint = "ruff check . && ruff format --check ."
format = "ruff format ."
pre_test = "task lint"
test = "pytest -s -x --cov=src -vv"
